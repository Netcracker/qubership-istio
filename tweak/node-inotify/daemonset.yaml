{{/*
  The upstream @CHART@ DaemonSet with the node inotify tuning init container added. The
  upstream template is rendered and re-parsed rather than patched, so nothing is tied to
  an upstream line number.

  The init container runs the kubectl image, because the ambient profile pulls distroless
  Istio images that have no shell. An empty $ds.kind means the resource scope excluded
  this chart, and the original render is returned unchanged.
*/}}
{{- $rendered := include "qubership.@CHART@-daemonset-upstream" . -}}
{{- $ds := fromYaml $rendered -}}
{{- $tuning := dig "nodeTuning" dict .Values.global -}}
{{- if and $ds.kind $tuning.enabled -}}
{{- $spec := $ds.spec.template.spec -}}
{{- $main := index $spec.containers 0 -}}
{{- $init := fromYaml (include "qubership.@CHART@-node-inotify" (dict
      "image" (include "qubership.kubectl.image" .)
      "pullPolicy" $main.imagePullPolicy
      "instances" $tuning.inotify.maxUserInstances
      "watches" $tuning.inotify.maxUserWatches)) -}}
{{- $volume := dict "name" "node-inotify" "hostPath" (dict "path" "/proc/sys/fs/inotify" "type" "Directory") -}}
{{- $_ := set $spec "initContainers" (append ($spec.initContainers | default list) $init) -}}
{{- $_ := set $spec "volumes" (append ($spec.volumes | default list) $volume) -}}
{{ toYaml $ds }}
{{- else -}}
{{ $rendered }}
{{- end -}}
