{{/*
  The upstream istiod Service with serviceLabels added. The upstream template is rendered
  and re-parsed rather than patched, so nothing is tied to an upstream line number.

  Helm turns "<no value>" into an empty string only in the final output, not in an
  included template, so the same replacement runs here before parsing. Without it a
  quoted empty value, such as the PLATFORM variable, comes back as null.

  A label the upstream chart sets keeps its value. An empty render, when the resource
  scope or a remote istiod excludes the Service, is returned unchanged. A render that does
  not parse fails, so an upstream change cannot drop the labels unnoticed.
*/}}
{{- $rendered := include "qubership.istiod-service-upstream" . | replace "<no value>" "" -}}
{{- $svc := fromYaml $rendered -}}
{{- with $svc.Error -}}
{{- fail (printf "tweak/istiod-service-labels: the upstream istiod Service does not parse: %s" .) -}}
{{- end -}}
{{- if and $svc.kind .Values.serviceLabels -}}
{{- $_ := set $svc.metadata "labels" (merge (dict) ($svc.metadata.labels | default dict) .Values.serviceLabels) -}}
{{ toYaml $svc }}
{{- else -}}
{{ $rendered }}
{{- end -}}
