{{- /*
  Trusts the ztunnel of this release on the openshift platform when no namespace is given.

  The upstream openshift profile sets trustedZtunnelNamespace to kube-system, where Istio
  installs ztunnel on OpenShift. This distribution installs ztunnel in the release namespace,
  so istiod would refuse certificates to it and pods in ambient would get none.

  Before zzz_profile.yaml runs, .Values holds only the values the user set: the chart defaults
  sit under _internal_defaults_do_not_set. Setting the key here makes it a user value, which
  the profile does not override. An explicit trustedZtunnelNamespace still wins.
*/ -}}
{{- if and (eq ((coalesce .Values.platform (dig "platform" "" (.Values.global | default dict))) | default "") "openshift") (not (hasKey .Values "trustedZtunnelNamespace")) -}}
{{- $_ := set .Values "trustedZtunnelNamespace" .Release.Namespace -}}
{{- end -}}
