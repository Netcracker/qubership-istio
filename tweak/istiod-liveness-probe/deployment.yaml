{{/*
  The upstream istiod Deployment with livenessProbe added to the discovery container. The
  upstream template is rendered and re-parsed rather than patched, so nothing is tied to an
  upstream line number.

  Helm turns "<no value>" into an empty string only in the final output, not in an
  included template, so the same replacement runs here before parsing. Without it a
  quoted empty value, such as the PLATFORM variable, comes back as null.

  The render is split into YAML documents, because fromYaml reads only the first one. Only
  the Deployment is changed; any other document is kept as upstream renders it.

  A liveness probe the upstream chart sets itself is kept. An empty livenessProbe value
  leaves the container as upstream renders it, and so does an empty render: the resource
  scope or a remote istiod excluded the Deployment. A document that does not parse fails
  the render, so an upstream change cannot drop the probe unnoticed.
*/}}
{{- $docs := list -}}
{{- range $doc := include "qubership.istiod-deployment-upstream" . | replace "<no value>" "" | splitList "\n---" -}}
{{- if trim $doc -}}
{{- $obj := fromYaml $doc -}}
{{- with $obj.Error -}}
{{- fail (printf "tweak/istiod-liveness-probe: the upstream istiod deployment.yaml does not parse: %s" .) -}}
{{- end -}}
{{- if and (eq (toString $obj.kind) "Deployment") $.Values.livenessProbe -}}
{{- range $container := $obj.spec.template.spec.containers -}}
{{- if and (eq $container.name "discovery") (not $container.livenessProbe) -}}
{{- $_ := set $container "livenessProbe" $.Values.livenessProbe -}}
{{- end -}}
{{- end -}}
{{- $docs = append $docs (toYaml $obj) -}}
{{- else -}}
{{- $docs = append $docs (trimPrefix "\n" $doc) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{ join "\n---\n" $docs }}
