name: Build Artifacts

# Triggers, and why each one exists:
#
#   push (any branch)  : builds and publishes a dev image tagged after the
#                        branch. Covers same-repo pull requests too, because a
#                        PR branch lives in this repository.
#   pull_request       : covers fork pull requests only (see the `if` on
#                        helm-charts-build). A fork gets no push trigger, and
#                        its GITHUB_TOKEN cannot write packages, so the build
#                        runs in dry-run mode.
#   workflow_call      : the release workflow drives the same pipeline with an
#                        explicit qubership-istio version.
#   workflow_dispatch  : manual rebuild of a branch.
permissions:
  contents: read
  packages: write
  actions: read
on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 1.1.0), empty for dev builds'
        required: false
        type: string
        default: ""
      ref:
        description: 'Git reference (branch, tag, or SHA) to checkout and build'
        required: false
        type: string
        default: ""
      latest:
        description: 'Tag the release image latest (default branch only)'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'dry run'
        required: false
        type: boolean
        default: false
      skip-tests:
        description: 'skip tests'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'skip tests'
        type: boolean
        default: false
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'CODE-OF-CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
  pull_request:
    branches: [main]
    types:
      [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'CODE-OF-CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'

concurrency:
  # On main, nothing is cancelled, so the sha names the group.
  # On other branches, a new push cancels the run in flight.
  # The event name is part of the group so that a release run and the main CI
  # build at the same commit do not cancel each other.
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  helm-charts-build:
    # A same-repo pull request is already built by the push trigger on its
    # branch. Only fork pull requests need this event, so skip the duplicate.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      istio-version: ${{ steps.version.outputs.istio-version }}
      chart-version: ${{ steps.version.outputs.chart-version }}
      image-tags: ${{ steps.version.outputs.image-tags }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve chart version and image tags
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          MARK_LATEST: ${{ inputs.latest }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
          # A fork cannot write packages, and renovate images are not wanted in
          # the registry. Both are built, neither is published.
          FORCE_DRY_RUN: ${{ inputs.dry-run || (github.event_name == 'pull_request') || (github.actor == 'renovate[bot]') }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          ISTIO_VERSION="$(yq e '.dependencies[0].version' helm-templates/qubership-istio/Chart.yaml)"

          if [ -n "${RELEASE_VERSION}" ]; then
            # Release build. The image carries the qubership-istio version as
            # the primary tag; the istio alias keeps the bundled istio version
            # visible in the registry listing.
            CHART_VERSION="${RELEASE_VERSION}"
            IMAGE_TAGS="${RELEASE_VERSION},${RELEASE_VERSION%.*},${RELEASE_VERSION}-istio${ISTIO_VERSION}"
            # `latest` follows the newest release only. A patch cut from a
            # maintenance line is older than the tip, so it must not claim it.
            if [ "${MARK_LATEST}" = "true" ]; then
              IMAGE_TAGS="${IMAGE_TAGS},latest"
            fi
          else
            # Dev build. Helm requires a SemVer chart version, so the branch
            # name goes into a prerelease segment with unsupported characters
            # collapsed to hyphens.
            SLUG="$(echo "${REF_NAME}" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')"
            SLUG="${SLUG:-build}"
            CHART_VERSION="0.0.0-${SLUG}"
            IMAGE_TAGS="${SLUG}"
          fi

          {
            echo "istio-version=${ISTIO_VERSION}"
            echo "chart-version=${CHART_VERSION}"
            echo "image-tags=${IMAGE_TAGS}"
            echo "dry-run=${FORCE_DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

          TESTS_STATE="run"
          if [ "${SKIP_TESTS}" = "true" ]; then
            TESTS_STATE="skipped"
            if [ -n "${RELEASE_VERSION}" ]; then
              echo "::warning::Integration tests were skipped, so ${RELEASE_VERSION} is being published without any cluster having run it."
            fi
          fi

          {
            echo "**Chart version**: ${CHART_VERSION}"
            echo "**Istio version**: ${ISTIO_VERSION}"
            echo "**Image tags**: ${IMAGE_TAGS}"
            echo "**Dry run**: ${FORCE_DRY_RUN}"
            echo "**Integration tests**: ${TESTS_STATE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp Chart.yaml version and appVersion
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart-version }}
          ISTIO_VERSION: ${{ steps.version.outputs.istio-version }}
        run: |
          yq e -i '.version = strenv(CHART_VERSION) | .appVersion = strenv(ISTIO_VERSION)' \
            helm-templates/qubership-istio/Chart.yaml

      - name: Install Helm 4
        uses: azure/setup-helm@v5
        with:
          version: v4.0.1

      - name: Build qubership-istio chart dependencies
        run: helm dependency build helm-templates/qubership-istio

      - name: Extract images from rendered Helm templates
        run: |
          helm template istio helm-templates/qubership-istio > /tmp/rendered.yaml

          # Extract images from known workload resources by exact kind/name/path using yq.
          # Each document is selected by kind+metadata.name; image is at a deterministic path.
          CNI_IMAGE=$(yq e 'select(.kind == "DaemonSet" and .metadata.name == "istio-cni-node")
            | .spec.template.spec.containers[0].image' /tmp/rendered.yaml)

          ISTIOD_IMAGE=$(yq e 'select(.kind == "Deployment" and .metadata.name == "istiod")
            | .spec.template.spec.containers[0].image' /tmp/rendered.yaml)

          ZTUNNEL_IMAGE=$(yq e 'select(.kind == "DaemonSet" and .metadata.name == "ztunnel")
            | .spec.template.spec.containers[0].image' /tmp/rendered.yaml)

          cat > ./helm-templates/qubership-istio/effective-images.yaml <<EOF
          install_cni_image: ${CNI_IMAGE}
          pilot_image: ${ISTIOD_IMAGE}
          ztunnel_image: ${ZTUNNEL_IMAGE}
          EOF

      - name: Inject tweak templates into subchart packages
        run: bash tweak/tweak.sh

      - name: Upload helm-templates artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-templates
          path: ./helm-templates/qubership-istio

  integration-test:
    needs: [ helm-charts-build ]
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/integration-test.yml
    with:
      ref: ${{ inputs.ref }}

  multiplatform_build:
    needs: [ helm-charts-build, integration-test ]
    # A skipped integration matrix must not skip the publish with it, but a
    # failed or cancelled one still has to stop here.
    if: >-
      !cancelled()
      && needs.helm-charts-build.result == 'success'
      && (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Build and push
        uses: netcracker/qubership-workflow-hub/actions/docker-action@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        with:
          component: |
            [{
              "name": "qubership-istio-transfer",
              "dockerfile": "./Dockerfile",
              "build_context": "."
            }]
          checkout: true
          ref: ${{ inputs.ref }}
          # `ref` is a commit SHA on the release path, so the action's checkout
          # lands on a detached HEAD. The hub defaults this to `git`, which makes
          # docker/metadata-action read the local repo to infer a branch and fail
          # with "Cannot infer ref from detached HEAD". `workflow` reads
          # GITHUB_REF instead. Its output is discarded either way, because the
          # tags below are explicit.
          context: workflow
          download-artifact: true
          download-artifact-name: helm-templates
          download-artifact-path: ./helm-templates/qubership-istio/
          download-artifact-merge-multiple: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.helm-charts-build.outputs.image-tags }}
          registry: ghcr.io
          dry-run: ${{ needs.helm-charts-build.outputs.dry-run }}
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
