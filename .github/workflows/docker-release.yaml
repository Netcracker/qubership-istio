---
# Cuts a qubership-istio release: verify the tag is free, tag the head of the
# branch this workflow is dispatched on, build and publish the transfer image,
# then publish the GitHub release page with notes drafted from merged PRs.
#
# The build is not done here. It is delegated to docker-publish.yml, which
# assembles the Helm chart (subchart dependencies, effective-images.yaml, tweak
# templates) before the Docker build. The transfer image is `FROM scratch` and
# carries only `helm-templates`.
#
# The tag is created before the build, so a published image always has a Git
# tag behind it. A failed build drops the tag again — see `rollback-tag`.

name: "Docker Images Release"
run-name: "${{ github.repository }} release ${{ inputs.release }} by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version, e.g. 1.0.0 — numbers and dots only, no leading v'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: "Check if tag exists"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Check if tag exists"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        with:
          tag-name: ${{ inputs.release }}
          ref: ${{ github.ref }}
          create-tag: false
          check-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-tag:
    name: "Create Release Tag"
    needs: [check-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Create Tag"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        with:
          tag-name: ${{ inputs.release }}
          ref: ${{ github.ref }}
          tag-message: "qubership-istio ${{ inputs.release }}"
          create-tag: true
          check-tag: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: "Build and publish image"
    needs: [create-tag]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ inputs.release }}
      # Build from the tag just created, so the logs name the release rather
      # than a bare ref. The tag is immutable and points at the commit the run
      # started from, so this pins the same tree the tag describes.
      ref: refs/tags/${{ inputs.release }}
      # Only a release cut from the default branch moves the floating tags.
      latest: ${{ github.ref_name == github.event.repository.default_branch }}

  github-release:
    name: "Github Release"
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.release }}
          persist-credentials: false

      - name: "Release-drafter"
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619 # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: true
          name: ${{ inputs.release }}
          tag: ${{ inputs.release }}
          version: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A failed build or a failed publish leaves no release behind, so drop the
  # tag it was cut for. Leaving it strands the tag ahead of every release and
  # makes the next run collide with a version that has no artifacts.
  rollback-tag:
    name: "Roll back tag"
    needs: [create-tag, build-and-publish, github-release]
    if: ${{ always() && failure() && needs.create-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Delete tag"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        with:
          tag-name: ${{ inputs.release }}
          ref: ${{ github.ref }}
          create-tag: false
          delete-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
