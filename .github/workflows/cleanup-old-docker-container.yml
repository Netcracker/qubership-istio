---
# Deletes old container versions of the transfer image from GHCR.
#
# The exclude list has to match the tag scheme that docker-publish.yml actually
# produces. Every tag it writes is prefixed with the full istio version:
#
#   1.28.10-2.7.0    release image        keep forever
#   1.28.10-latest   floating tag         keep forever
#   1.28.10-main     dev build of main    keep
#   1.28.10-feat_x   dev build            delete once it ages out
#
# The patterns below are prefix-aware:
#
#   *-*.*.*    a hyphen followed by a dotted triple — the release version.
#              Counting dots alone would not do: the istio prefix already
#              carries two, so every branch build would look like a release.
#   *-latest   the floating tag on any istio line
#   *-main     dev builds of the default branch
#
# Wildcard semantics and the `semver` keyword are documented in the action:
# https://github.com/Netcracker/qubership-workflow-hub/tree/main/actions/container-package-cleanup

name: Cleanup Old Docker Container Versions
run-name: "${{ github.event_name }} - ${{ github.actor }}"

on:
  schedule:
    - cron: "0 0 * * 0" # Runs weekly on Sunday at midnight
  workflow_dispatch:
    inputs:
      threshold-days:
        description: "Number of days to keep container versions"
        required: false
        default: "7"
      included-tags:
        description: "Tags to include for deletion"
        required: false
        default: "*"
      excluded-tags:
        description: "Tags to exclude from deletion"
        required: false
        default: "*-*.*.*,*-latest,*-main,release*"
      dry-run:
        description: "Enable dry-run mode"
        required: false
        default: true
        type: boolean
      debug:
        description: "Enable debug mode"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  cleanup:
    name: "Cleanup Old Docker Container Versions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      THRESHOLD_DAYS: ${{ github.event.inputs.threshold-days || '7' }}
      INCLUDED_TAGS: ${{ github.event.inputs.included-tags || '*' }}
      EXCLUDED_TAGS: ${{ github.event.inputs.excluded-tags || '*-*.*.*,*-latest,*-main,release*' }}
      DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
      DEBUG: ${{ github.event.inputs.debug || 'false' }}
    steps:
      - name: "Summary"
        run: |
          {
            echo "**Event**: $GITHUB_EVENT_NAME"
            echo "**Actor**: $GITHUB_ACTOR"
            echo "**Threshold days**: $THRESHOLD_DAYS"
            echo "**Included tags**: $INCLUDED_TAGS"
            echo "**Excluded tags**: $EXCLUDED_TAGS"
            echo "**Dry-run**: $DRY_RUN"
            echo "**Debug**: $DEBUG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Run Container Package Cleanup Action"
        uses: netcracker/qubership-workflow-hub/actions/container-package-cleanup@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        with:
          threshold-days: ${{ env.THRESHOLD_DAYS }}
          included-tags: ${{ env.INCLUDED_TAGS }}
          excluded-tags: ${{ env.EXCLUDED_TAGS }}
          package-type: container
          dry-run: ${{ env.DRY_RUN }}
          debug: ${{ env.DEBUG }}
        env:
          PACKAGE_TOKEN: ${{ secrets.GH_RWD_PACKAGE_TOKEN }}
