name: Integration Test
on:
  workflow_call: {}

jobs:
  # Build and lint the chart once. The matrix legs below differ only in cluster
  # IP family, so this setup — which does not depend on matrix.* — runs a single
  # time and ships the extracted chart to the legs as an artifact.
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The chart's Istio subcharts (base, cni, istiod, ztunnel) are not
      # committed; they are vendored into charts/ by the helm-charts-build job
      # and shipped in this artifact. The transfer image is built from the repo
      # checkout, so the artifact must be restored into the build context here —
      # otherwise the image carries a chart with no charts/ and the install
      # fails with "missing in charts/ directory".
      - name: Download helm-templates artifact
        uses: actions/download-artifact@v8
        with:
          name: helm-templates
          path: ./helm-templates/qubership-istio

      - name: Build transfer image locally (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            -t qubership-istio-transfer:test \
            -f Dockerfile .

      # The transfer image is FROM scratch — no shell, so we use docker create + docker cp
      - name: Extract helm-templates from transfer image
        run: |
          CID=$(docker create --entrypoint="" qubership-istio-transfer:test /bin/sh)
          docker cp ${CID}:/helm-templates ./helm-templates-extracted
          docker rm ${CID}

      - name: Install Helm 4
        uses: azure/setup-helm@v5
        with:
          version: v4.0.1

      - name: Setup Python (required for ct)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2

      # Lint chart (includes schema validation)
      - name: Run ct lint
        run: ct lint --all --chart-dirs ./helm-templates-extracted/qubership-istio

      # Ship the built chart (with vendored charts/) so the matrix legs install
      # the same artifact instead of each rebuilding the transfer image.
      - name: Upload extracted chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-templates-extracted
          path: ./helm-templates-extracted

  integration-test:
    needs: build-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each job runs an explicit list of tests on a cluster of the matching
        # IP family — no wildcard, and dual-stack tests are never mixed with the
        # general functional tests.
        include:
          # Single-stack IPv4: gateway dns_lookup_family must be V4_ONLY, IPv4
          # works, no IPv6 path. Istio auto-detects the stack (no flag needed).
          - name: ipv4-stack
            ip_family: ipv4
            kind_config: tests/kind-ipv4.yaml
            tests: gateway-ip-family
            require_dual_stack: "false"
          # Single-stack IPv6: gateway dns_lookup_family must be V6_ONLY, IPv6
          # works. Istio auto-detects the stack (no flag needed).
          - name: ipv6-stack
            ip_family: ipv6
            kind_config: tests/kind-ipv6.yaml
            tests: gateway-ip-family
            require_dual_stack: "false"
          # Dual-stack: ISTIO_DUAL_STACK gates both the gateway (Envoy
          # dns_lookup_family + north-south IPv6) and ambient (ztunnel
          # east-west IPv6) data planes — all covered by istio-dual-stack.
          - name: dual-stack
            ip_family: dual
            kind_config: tests/kind-dual-stack.yaml
            tests: istio-dual-stack
            require_dual_stack: "true"
          # General functional tests (not IP-family specific), on a plain
          # single-stack IPv4 cluster — kept separate from the dual-stack tests.
          - name: functional
            ip_family: ipv4
            kind_config: tests/kind-ipv4.yaml
            tests: gateway num-trusted-proxies rollout istiod-rbac
            require_dual_stack: "false"
    name: integration-test (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The chart (with vendored charts/) was built and linted once by the
      # build-and-lint job; restore it instead of rebuilding the transfer image.
      - name: Download extracted chart
        uses: actions/download-artifact@v8
        with:
          name: helm-templates-extracted
          path: ./helm-templates-extracted

      - name: Install Helm 4
        uses: azure/setup-helm@v5
        with:
          version: v4.0.1

      # kind needs IPv6 enabled in the Docker daemon for ipv6/dual clusters.
      # Merge into the runner's existing daemon.json rather than overwrite it,
      # then VERIFY ipv6 actually came up — otherwise kind would silently
      # produce an IPv4-only cluster.
      - name: Enable IPv6 in Docker
        if: matrix.ip_family != 'ipv4'
        run: |
          sudo mkdir -p /etc/docker
          existing=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "${existing}" \
            | jq '. + {"ipv6": true, "fixed-cidr-v6": "fd00:dead:beef::/48", "ip6tables": true, "experimental": true}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          # Fail fast if ipv6 did not actually enable — kind would otherwise
          # silently build an IPv4-only cluster.
          enabled=$(docker network inspect bridge -f '{{.EnableIPv6}}' 2>/dev/null || echo unknown)
          if [ "${enabled}" != "true" ]; then
            echo "::error::Docker IPv6 did not enable (bridge EnableIPv6=${enabled}); cannot build an ${{ matrix.ip_family }} cluster"
            exit 1
          fi

      # Install kind/kubectl only, then create the cluster explicitly so the
      # ipFamily config is guaranteed to reach kind.
      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Create kind cluster (${{ matrix.name }})
        run: kind create cluster --name istio-test --config "${{ matrix.kind_config }}" --wait 120s

      # Fail fast (with the actual clusterIPs) if the cluster did not come up
      # in the IP family this job expects.
      - name: Verify cluster IP family (${{ matrix.ip_family }})
        run: |
          # Use node podCIDRs, not the kubernetes Service: that Service is
          # created SingleStack, so it only ever shows one family even on a
          # dual-stack cluster. podCIDRs reflect the actual cluster stack.
          cidrs=$(kubectl get nodes -o jsonpath='{range .items[*]}{.spec.podCIDRs[*]}{" "}{end}')
          echo "node podCIDRs: ${cidrs}"
          has4=false; has6=false
          for c in ${cidrs}; do
            case "${c}" in *:*) has6=true ;; *) has4=true ;; esac
          done
          case "${{ matrix.ip_family }}" in
            ipv4) [ "${has4}" = true ] && [ "${has6}" = false ] || { echo "expected IPv4-only"; exit 1; } ;;
            ipv6) [ "${has6}" = true ] && [ "${has4}" = false ] || { echo "expected IPv6-only"; exit 1; } ;;
            dual) [ "${has4}" = true ] && [ "${has6}" = true ]  || { echo "expected dual-stack"; exit 1; } ;;
          esac
          echo "OK: cluster IP family matches '${{ matrix.ip_family }}'"

      - name: Install Gateway API CRDs
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml

      - name: Helm install qubership-istio
        run: |
          helm upgrade --install qubership-istio ./helm-templates-extracted/qubership-istio \
            --namespace istio-system \
            --create-namespace \
            --timeout 3m \
            --wait \
            --force-conflicts \
            --set MONITORING_ENABLED=false

      # Run each named test explicitly (one test-suite invocation per test) so
      # no job depends on a wildcard. On the dual-stack cluster
      # REQUIRE_DUAL_STACK=true turns skipped IPv6 checks into hard failures.
      - name: Run integration tests (${{ matrix.name }})
        env:
          REQUIRE_DUAL_STACK: ${{ matrix.require_dual_stack }}
        run: |
          for t in ${{ matrix.tests }}; do
            echo "::group::test: ${t}"
            bash tests/test-suite.sh ./helm-templates-extracted/qubership-istio "${t}"
            echo "::endgroup::"
          done

      - name: Dump state on failure
        if: failure()
        run: |
          mkdir -p /tmp/istio-debug
          kubectl get all -n istio-system                                 > /tmp/istio-debug/resources.txt      2>&1
          kubectl describe pods -n istio-system                           > /tmp/istio-debug/pods-describe.txt  2>&1
          kubectl get events -n istio-system --sort-by='.lastTimestamp'   > /tmp/istio-debug/events.txt         2>&1
          kubectl logs -n istio-system -l app=istiod --tail=200           > /tmp/istio-debug/istiod-logs.txt    2>&1 || true
          kubectl logs -n istio-system -l k8s-app=istio-cni-node --tail=200 > /tmp/istio-debug/cni-logs.txt    2>&1 || true
          kubectl logs -n istio-system -l app=ztunnel --tail=200          > /tmp/istio-debug/ztunnel-logs.txt   2>&1 || true

      - name: Upload debug bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: istio-debug-${{ matrix.name }}-${{ github.run_id }}
          path: /tmp/istio-debug/
          retention-days: 7
