name: Integration Test
on:
  workflow_call: {}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download helm-templates artifact
        uses: actions/download-artifact@v8
        with:
          name: helm-templates
          path: ./helm-templates/qubership-istio

      - name: Build transfer image locally (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            -t qubership-istio-transfer:test \
            -f Dockerfile .

      # The transfer image is FROM scratch — no shell, so we use docker create + docker cp
      - name: Extract helm-templates from transfer image
        run: |
          CID=$(docker create --entrypoint="" qubership-istio-transfer:test /bin/sh)
          docker cp ${CID}:/helm-templates ./helm-templates-extracted
          docker rm ${CID}

      - name: Install Helm 4
        uses: azure/setup-helm@v5
        with:
          version: v4.0.1

      - name: Setup Python (required for ct)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2

      # Lint chart (includes schema validation)
      - name: Run ct lint
        run: ct lint --all --chart-dirs ./helm-templates-extracted/qubership-istio

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: istio-test

      - name: Install Gateway API CRDs
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml

      - name: Helm install qubership-istio
        run: |
          helm upgrade --install qubership-istio ./helm-templates-extracted/qubership-istio \
            --namespace istio-system \
            --create-namespace \
            --timeout 3m \
            --wait \
            --force-conflicts \
            --set MONITORING_ENABLED=false

      - name: Verify rollout
        run: |
          echo "::group::istiod deployment"
          kubectl rollout status deployment/istiod -n istio-system --timeout=120s
          kubectl get deployment istiod -n istio-system -o wide
          echo "::endgroup::"

          echo "::group::istio-cni-node daemonset"
          kubectl rollout status daemonset/istio-cni-node -n istio-system --timeout=120s
          kubectl get daemonset istio-cni-node -n istio-system -o wide
          echo "::endgroup::"

          echo "::group::ztunnel daemonset"
          kubectl rollout status daemonset/ztunnel -n istio-system --timeout=120s
          kubectl get daemonset ztunnel -n istio-system -o wide
          echo "::endgroup::"

          echo "::group::all pods"
          kubectl get pods -n istio-system -o wide
          echo "::endgroup::"

      - name: Verify numTrustedProxies in mesh config
        run: |
          MESH_CONFIG=$(kubectl get configmap istio -n istio-system -o jsonpath='{.data.mesh}')
          NUM_TRUSTED=$(echo "${MESH_CONFIG}" | yq e '.defaultConfig.gatewayTopology.numTrustedProxies')
          if [ "${NUM_TRUSTED}" != "1" ]; then
            echo "ERROR: numTrustedProxies expected 1, got ${NUM_TRUSTED}"
            echo "Full mesh config:"
            echo "${MESH_CONFIG}"
            exit 1
          fi
          echo "OK: numTrustedProxies=${NUM_TRUSTED}"

      - name: Deploy XFF test resources
        run: |
          kubectl create deployment httpbin \
            --image=mccutchen/go-httpbin:v2.15.0 \
            --port=8080 \
            -n default
          kubectl expose deployment httpbin --port=80 --target-port=8080 -n default

          kubectl apply -f - <<'EOF'
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: xff-test
            namespace: istio-system
          spec:
            gatewayClassName: istio
            listeners:
            - name: http
              protocol: HTTP
              port: 80
          EOF

          kubectl apply -f - <<'EOF'
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: httpbin
            namespace: default
          spec:
            parentRefs:
            - name: xff-test
              namespace: istio-system
            rules:
            - backendRefs:
              - name: httpbin
                port: 80
          EOF

      - name: Wait for XFF test resources
        run: |
          kubectl rollout status deployment/httpbin -n default --timeout=120s
          kubectl wait gateway/xff-test -n istio-system --for=condition=Programmed --timeout=120s
          kubectl rollout status deployment/xff-test-istio -n istio-system --timeout=120s

      - name: Verify XFF numTrustedProxies=1 behavior
        run: |
          kubectl port-forward -n istio-system svc/xff-test-istio 18080:80 &
          PF_PID=$!
          sleep 3

          # With numTrustedProxies=1 Envoy treats the direct peer (the port-forward
          # connection) as the one trusted proxy hop, so X-Envoy-External-Address
          # must equal the IP we placed in X-Forwarded-For.
          SPOOFED_IP="203.0.113.1"
          HEADERS=$(curl -sf -H "X-Forwarded-For: ${SPOOFED_IP}" http://127.0.0.1:18080/headers)
          kill ${PF_PID} 2>/dev/null || true

          EXTERNAL_ADDR=$(echo "${HEADERS}" | jq -r '
            .headers | to_entries[] |
            select(.key | ascii_downcase == "x-envoy-external-address") |
            .value' | head -1)
          if [ "${EXTERNAL_ADDR}" != "${SPOOFED_IP}" ]; then
            echo "ERROR: expected X-Envoy-External-Address=${SPOOFED_IP}, got ${EXTERNAL_ADDR}"
            echo "Full response: ${HEADERS}"
            exit 1
          fi
          echo "OK: X-Envoy-External-Address=${EXTERNAL_ADDR}"

      - name: Upgrade numTrustedProxies to 2
        run: |
          helm upgrade qubership-istio ./helm-templates-extracted/qubership-istio \
            --namespace istio-system \
            --timeout 3m \
            --wait \
            --reuse-values \
            --set istiod.meshConfig.defaultConfig.gatewayTopology.numTrustedProxies=2

      - name: Verify numTrustedProxies=2 in mesh config
        run: |
          MESH_CONFIG=$(kubectl get configmap istio -n istio-system -o jsonpath='{.data.mesh}')
          NUM_TRUSTED=$(echo "${MESH_CONFIG}" | yq e '.defaultConfig.gatewayTopology.numTrustedProxies')
          if [ "${NUM_TRUSTED}" != "2" ]; then
            echo "ERROR: numTrustedProxies expected 2, got ${NUM_TRUSTED}"
            echo "Full mesh config:"
            echo "${MESH_CONFIG}"
            exit 1
          fi
          echo "OK: numTrustedProxies=${NUM_TRUSTED}"

      - name: Verify XFF numTrustedProxies=2 behavior
        run: |
          kubectl port-forward -n istio-system svc/xff-test-istio 18080:80 &
          PF_PID=$!
          sleep 3

          # With numTrustedProxies=2 Envoy trusts 2 hops from the right of XFF.
          # We send 2 intermediate IPs; Envoy appends the peer, making 3 entries total.
          # X-Envoy-External-Address must be the leftmost (original client) IP.
          SPOOFED_IP="203.0.113.1"
          HEADERS=$(curl -sf -H "X-Forwarded-For: ${SPOOFED_IP}, 10.0.0.1" http://127.0.0.1:18080/headers)
          kill ${PF_PID} 2>/dev/null || true

          EXTERNAL_ADDR=$(echo "${HEADERS}" | jq -r '
            .headers | to_entries[] |
            select(.key | ascii_downcase == "x-envoy-external-address") |
            .value' | head -1)
          if [ "${EXTERNAL_ADDR}" != "${SPOOFED_IP}" ]; then
            echo "ERROR: expected X-Envoy-External-Address=${SPOOFED_IP}, got ${EXTERNAL_ADDR}"
            echo "Full response: ${HEADERS}"
            exit 1
          fi
          echo "OK: X-Envoy-External-Address=${EXTERNAL_ADDR}"

      - name: Dump state on failure
        if: failure()
        run: |
          mkdir -p /tmp/istio-debug
          kubectl get all -n istio-system                                 > /tmp/istio-debug/resources.txt      2>&1
          kubectl describe pods -n istio-system                           > /tmp/istio-debug/pods-describe.txt  2>&1
          kubectl get events -n istio-system --sort-by='.lastTimestamp'   > /tmp/istio-debug/events.txt         2>&1
          kubectl logs -n istio-system -l app=istiod --tail=200           > /tmp/istio-debug/istiod-logs.txt    2>&1 || true
          kubectl logs -n istio-system -l k8s-app=istio-cni-node --tail=200 > /tmp/istio-debug/cni-logs.txt    2>&1 || true
          kubectl logs -n istio-system -l app=ztunnel --tail=200          > /tmp/istio-debug/ztunnel-logs.txt   2>&1 || true

      - name: Upload debug bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: istio-debug-${{ github.run_id }}
          path: /tmp/istio-debug/
          retention-days: 7
