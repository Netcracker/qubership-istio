# Each block renders its objects when it is set; nothing renders by default.
# fixtures_render in tests/lib/utils.sh passes the values with --set-string, one call per use.

# A Gateway (class istio) with an HTTP listener on port 80 that accepts routes
# from every namespace, and the ConfigMap <name>-options with the resources of
# its proxy.
#   name, namespace (required)
#   cpuLimit (default "1"), memoryLimit (default 1Gi)
gateway: {}

# A waypoint for the Services of its namespace, and its <name>-options.
#   name, namespace (required)
#   cpuLimit (default "2"), memoryLimit (default 1Gi)
waypoint: {}

# One path of a gateway to port 80 of a Service.
#   name, namespace, gateway, gatewayNamespace, backend (required)
#   pathPrefix (default /), hostname (optional)
httpRoute: {}

# Services <prefix>-<from>..<prefix>-<to> without a selector, so without
# endpoints, with ports 80, 81, ...: one Envoy cluster per port. Labeled
# tests/services=<prefix>.
#   namespace, prefix, from, to (required)
#   ports (default 1)
#   selector (default false): select app=<prefix>-<i>, for the workloadEntries block
services: {}

# HTTPRoutes from a gateway to <servicePrefix>-1..<servicePrefix>-<count> on
# port 80, labeled tests/route=bulk.
#   namespace, gateway, gatewayNamespace, servicePrefix, count (required)
#   rulesPerRoute (default 16, the Gateway API limit)
routes: {}

# An EnvoyFilter on a gateway that inserts an ext_proc filter calling Envoy
# cluster <cluster> by name: the case that needs the
# envoyfilter.istio.io/referenced-services annotation once
# PILOT_FILTER_GATEWAY_CLUSTER_CONFIG is on. All processing modes are SKIP and
# failures are allowed, so the filter never touches traffic.
#   name, namespace, gateway, cluster (required)
#   referencedServices (optional): value of the annotation
clusterRefFilter: {}

# Nodes <prefix>-<from>..<prefix>-<to> that KWOK keeps Ready, labeled
# type=kwok and tainted kwok.x-k8s.io/node=fake:NoSchedule so that only pods
# tolerating the taint land there. Needs KWOK in the cluster.
#   from, to (required)
#   prefix (default kwok-node), pods: pods per node (default 200)
fakeNodes: {}

# Services <prefix>-<from>..<prefix>-<to>, each selecting a Deployment of the
# same name whose pods run on the KWOK nodes: no containers, but a pod IP, so
# the Service has endpoints and istiod a workload per pod. Labeled
# tests/apps=<prefix>.
#   namespace, prefix, from, to (required)
#   replicas (default 1)
#   ambient (default false): annotate the pods the way istio-cni does when it
#   captures a pod, so istiod sends them as HBONE workloads
fakeApps: {}

# A fortio echo server and two fortio clients in one namespace: Deployment and
# Service echo, the Service echo-direct (istio.io/use-waypoint: none) for the
# same pods, Deployment client outside the mesh (istio.io/dataplane-mode:
# none) and Deployment client-mesh, which follows its namespace. The clients
# run a fortio server too, to stay up; load runs through kubectl exec.
#   namespace (required)
#   image (default fortio/fortio:1.75.3)
#   serverNode, clientNode (optional): kubernetes.io/hostname to pin the
#   server and the clients to
fortio: {}

# A NodePort Service istiod-sizing for the xDS port 15012 of istiod, for
# simulated proxies running outside the cluster.
#   namespace, nodePort (required)
istiodNodePort: {}

# EndpointSlices for the Services <prefix>-<from>..<prefix>-<to> of the
# services block (which have no selector), each with <endpoints> ready
# endpoints on port 8080, so the Services get endpoints without pods. The
# addresses come from 198.18.0.0/15, a range reserved for benchmarks that no
# network routes: nothing ever connects to them.
#   namespace, prefix, from, to (required)
#   endpoints (default 1)
endpointSlices: {}

# WorkloadEntries for the Services <prefix>-<from>..<prefix>-<to> of the
# services block with selector=true: <endpoints> per Service, labeled
# app=<prefix>-<i>, which Kubernetes Services select in Istio. Each is
# annotated the way istio-cni annotates a captured pod, so istiod sends it as
# an ambient workload and gateways reach it over HBONE: the endpoints cost
# what mesh pods cost, without pods. Addresses as in endpointSlices.
#   namespace, prefix, from, to (required)
#   endpoints (default 1)
workloadEntries: {}

# An AuthorizationPolicy on a gateway that denies every request for one host:
# with a route that exists only to keep a Service's cluster on the gateway
# (pinned under PILOT_FILTER_GATEWAY_CLUSTER_CONFIG), nobody can use that route.
#   name, namespace, gateway, host (required)
denyHost: {}
