{{- with .Values.routes }}
{{- $namespace := required "routes.namespace is required" .namespace }}
{{- $gateway := required "routes.gateway is required" .gateway }}
{{- $gatewayNamespace := required "routes.gatewayNamespace is required" .gatewayNamespace }}
{{- $prefix := required "routes.servicePrefix is required" .servicePrefix }}
{{- $count := int (required "routes.count is required" .count) }}
{{- $rules := int (.rulesPerRoute | default 16) }}
{{- range $r := until (int (div (add $count (sub $rules 1)) $rules)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $prefix }}-route-{{ add $r 1 }}
  namespace: {{ $namespace }}
  labels:
    tests/route: bulk
spec:
  parentRefs:
  - name: {{ $gateway }}
    namespace: {{ $gatewayNamespace }}
  rules:
  {{- range $k := until $rules }}
  {{- $i := add (mul $r $rules) $k 1 }}
  {{- if le (int $i) $count }}
  - matches:
    - path:
        type: PathPrefix
        value: /{{ $prefix }}-{{ $i }}
    backendRefs:
    - name: {{ $prefix }}-{{ $i }}
      port: 80
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
