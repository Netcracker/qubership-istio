{{- with .Values.waypoint }}
{{- $name := required "waypoint.name is required" .name }}
{{- $namespace := required "waypoint.namespace is required" .namespace }}
{{ include "fixtures.proxyOptions" (dict "name" $name "namespace" $namespace "cpuLimit" (.cpuLimit | default "2") "memoryLimit" (.memoryLimit | default "1Gi")) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $name }}-options
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
{{- end }}
