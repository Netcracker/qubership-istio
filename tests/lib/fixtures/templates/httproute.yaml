{{- with .Values.httpRoute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "httpRoute.name is required" .name }}
  namespace: {{ required "httpRoute.namespace is required" .namespace }}
spec:
  parentRefs:
  - name: {{ required "httpRoute.gateway is required" .gateway }}
    namespace: {{ required "httpRoute.gatewayNamespace is required" .gatewayNamespace }}
  {{- with .hostname }}
  hostnames:
  - {{ . | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .pathPrefix | default "/" | quote }}
    backendRefs:
    - name: {{ required "httpRoute.backend is required" .backend }}
      port: 80
{{- end }}
