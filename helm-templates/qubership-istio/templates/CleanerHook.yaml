{{- if and .Values.cleanerHook .Values.cleanerHook.enabled }}
---
# What a cleaner that reads the label below is meant to run before it empties the namespace.
#
# A Clean Install deletes the namespace's resources and leaves the cluster objects alone, so
# the Istio webhook configurations survive it while the istiod service they call does not.
# For the minutes until the new istiod is ready, every write of a *.istio.io resource in the
# cluster fails with `failed calling webhook "validation.istio.io"`, and a pod asking for
# sidecar injection fails the same way. This hook switches those webhooks to
# `failurePolicy: Ignore` first, so the API server lets such requests through while nothing
# answers, and moves them off the istio.io/rev label that the live istiod reconciles by. The
# next install applies the configurations from the chart, with the label and `Fail` again.
#
# The hook brings no RBAC of its own. It runs as the istiod service account, which the istiod
# chart's istiod-webhook-rbac role already lets get and update exactly these configurations, by
# name. That account may not delete them, which is why the hook updates rather than deletes.
#
# The contract this relies on: a cleaner selects the CronJobs of the namespace being cleaned by
# the app.kubernetes.io/name=cleaner label, reads the service account from the pod template, and
# creates a Job of its own from that template rather than triggering the CronJob, which is why
# `suspend` keeps the schedule from also firing. It waits for the Job and only then deletes the
# objects of the namespace. Where no cleaner reads the label, this file is an idle CronJob.
#
# Where a cleaner does read the label, a Job that fails fails the whole clean, so the script
# tolerates webhooks that are not there and exits non-zero only when a list or an update was
# refused.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: istio-cleaner-hook
  labels:
    app: qubership-istio
    release: {{ .Release.Name }}
    # What the cleaner selects on. It has to be on the CronJob, not on the pod template.
    app.kubernetes.io/name: cleaner
    app.kubernetes.io/part-of: qubership-istio
    app.kubernetes.io/component: cleaner-hook
spec:
  # Required by the API. The cleaner never waits for a scheduled run.
  schedule: "0 4 * * *"
  suspend: true
  jobTemplate:
    spec:
      # One attempt: a refused list or update does not get better on a second try, and a
      # retry costs the clean the time it is allowed to take. Write conflicts are retried
      # inside the script.
      backoffLimit: 0
      template:
        metadata:
          name: istio-cleaner-hook
          labels:
            app: qubership-istio
            app.kubernetes.io/name: cleaner
            app.kubernetes.io/part-of: qubership-istio
            app.kubernetes.io/component: cleaner-hook
        spec:
          restartPolicy: Never
          # The cleaner token-requests this account; an empty name breaks the clean. The
          # account and its rights come with the istiod chart.
          serviceAccountName: istiod
          # Nothing privileged: this pod has to be admissible without the exemption that
          # the ambient agents need, and it only calls the API.
          securityContext:
            {{- toYaml (.Values.cleanerHook.podSecurityContext | default dict) | nindent 12 }}
          containers:
            - name: ignore-webhooks
              image: {{ include "qubership.kubectl.image" . | quote }}
              {{- with (.Values.global).imagePullPolicy }}
              imagePullPolicy: {{ . }}
              {{- end }}
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                # Image sets HOME=/ and the rootfs is read-only; point kubectl's cache at /tmp.
                - name: HOME
                  value: /tmp
                - name: KUBECACHEDIR
                  value: /tmp/.kube/cache
              # The image's ENTRYPOINT is kubectl, so command must be a shell.
              command:
                - /bin/sh
                - -c
                - |
                  set -o nounset

                  # A configuration is selected by the service it calls, not by its name:
                  # once this namespace is emptied, nothing answers a webhook that calls a
                  # service here. Another Istio installation in the cluster uses the same
                  # names and calls its own namespace, so it is left alone. Only the first
                  # webhook is read, because the JSONPath filter takes no wildcard there;
                  # every webhook of an Istio configuration calls the same istiod.
                  SELECT='{range .items[?(@.webhooks[0].clientConfig.service.namespace=="'"${NAMESPACE}"'")]}{.metadata.name}{" "}{end}'
                  failed=0

                  for kind in validatingwebhookconfigurations mutatingwebhookconfigurations; do
                    if ! names="$(kubectl get "${kind}" -o jsonpath="${SELECT}")"; then
                      failed=1
                      continue
                    fi
                    if [ -z "${names}" ]; then
                      echo "no ${kind} call a service in ${NAMESPACE}"
                      continue
                    fi
                    # Unquoted on purpose: one word per name.
                    for name in ${names}; do
                      # istiod sets failurePolicy back to Fail on the validating webhooks it
                      # watches, and it watches them by the istio.io/rev label: the same write
                      # changes that label, so istiod leaves them be. A write conflicts when
                      # istiod rewrites the CA bundle at the same moment, so the read and the
                      # write are tried again together.
                      updated=0
                      for attempt in 1 2 3; do
                        if kubectl get "${kind}" "${name}" -o json \
                            | sed -e 's/"failurePolicy": "Fail"/"failurePolicy": "Ignore"/g' \
                                  -e 's/"istio.io\/rev": "[^"]*"/"istio.io\/rev": "cleaner-hook"/' \
                            | kubectl replace -f - >/dev/null; then
                          updated=1
                          break
                        fi
                        sleep 2
                      done
                      if [ "${updated}" = 1 ]; then
                        echo "${kind}/${name}: failurePolicy Ignore, istio.io/rev cleaner-hook"
                      else
                        failed=1
                      fi
                    done
                  done

                  # An empty cluster is the normal case for a namespace that never held
                  # Istio webhooks, and a clean must not fail on it.
                  exit "${failed}"
              resources:
                {{- toYaml (.Values.cleanerHook.resources | default dict) | nindent 16 }}
              securityContext:
                {{- toYaml (.Values.cleanerHook.containerSecurityContext | default dict) | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Only so readOnlyRootFilesystem and HOME=/tmp can coexist.
            - name: tmp
              emptyDir: {}
{{- end }}
