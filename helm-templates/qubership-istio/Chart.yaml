apiVersion: v2
name: qubership-istio
description: A Helm chart that assembles all Istio component charts (base, cni, istiod, ztunnel)
type: application
# Placeholders. The build stamps `version` with the qubership-istio release
# version (or `0.0.0-<branch>` for a dev build) and `appVersion` with the
# bundled istio version. See .github/workflows/docker-publish.yml.
version: 0.0.1
appVersion: "1.30.2"
dependencies:
  - name: base
    version: "1.30.2"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: cni
    version: "1.30.2"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: istiod
    version: "1.30.2"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: ztunnel
    version: "1.30.2"
    repository: "https://istio-release.storage.googleapis.com/charts"
