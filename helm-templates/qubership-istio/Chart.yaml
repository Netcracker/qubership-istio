apiVersion: v2
name: qubership-istio
description: A Helm chart that assembles all Istio component charts (base, cni, istiod, ztunnel)
type: application
# The effective version will be computed during Helm generation
version: 0.0.1
dependencies:
  - name: base
    version: "1.30.6"
    repository: "https://blob.istio.io/istio-release/charts"
  - name: cni
    version: "1.30.6"
    repository: "https://blob.istio.io/istio-release/charts"
  - name: istiod
    version: "1.30.6"
    repository: "https://blob.istio.io/istio-release/charts"
  - name: ztunnel
    version: "1.30.6"
    repository: "https://blob.istio.io/istio-release/charts"
