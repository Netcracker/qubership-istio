global:
  profile: ambient

  # namespace where istio will be installed
  istioNamespace: istio-system

  # Security context for the injected proxy (sidecars and Gateway API proxies).
  # The injection template already drops all capabilities, sets a read-only root
  # filesystem, and runs as a non-root user. These settings complete the baseline:
  # they keep privilege escalation off and pin the default seccomp profile.
  proxy:
    privileged: false
    seccompProfile:
      type: RuntimeDefault

  # Default hub for Istio images.
  # hub: docker.io/istio

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

# ---------------------------------------------------------------------------
# istio-base — CRDs and cluster-scoped resources
# ---------------------------------------------------------------------------
base:
  # Override the failurePolicy for the validation webhook.
  # By default, the webhook starts with "Ignore" and istiod flips it to "Fail" once ready.
  # Set to "Fail" to avoid the flip-flop, which is useful for server-side apply tools
  base:
    validationFailurePolicy: Fail    

# ---------------------------------------------------------------------------
# cni — CNI plugin DaemonSet
# ---------------------------------------------------------------------------
cni:
  # Default hub for Istio images.
  # hub: docker.io/istio

  # Can be a full hub/image:tag
  # image: install-cni

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

  # The CNI agent installs network configuration on each node, so it must run as
  # root and keep NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_PTRACE, and DAC_OVERRIDE, and
  # it mounts host paths. These privileges are required and cannot be dropped.
  # Pin the seccomp profile, which is the one baseline control the agent can still
  # honor.
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# istiod — control plane (Pilot / istiod)
# ---------------------------------------------------------------------------
istiod:
  # Default hub for Istio images.
  # hub: docker.io/istio

  # Can be a full hub/image:tag
  # image: pilot

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

  # Override the failurePolicy for the validation webhook.
  # By default, the webhook starts with "Ignore" and istiod flips it to "Fail" once ready.
  # Set to "Fail" to avoid the flip-flop, which is useful for server-side apply tools
  base:
    validationFailurePolicy: Fail    

  # ISTIO_DUAL_STACK requires two coordinated settings:
  #
  # 1. meshConfig.defaultConfig.proxyMetadata.ISTIO_DUAL_STACK
  #    istiod copies each proxyMetadata entry into the generated gateway pod as
  #    an environment variable, so this carries the flag into the gateway proxy.
  #
  # 2. env.ISTIO_DUAL_STACK (istiod Deployment env var)
  #    Changing this mutates the istiod pod template, which restarts istiod.
  #    Only a restarted istiod re-reads the mesh ConfigMap and reconciles
  #    existing gateway Deployments with the updated ProxyConfig.ProxyMetadata.
  #
  # Both must be changed together so that: (a) the new value is in the mesh
  # config, and (b) istiod restarts and propagates it to gateway pods.
  env:
    ISTIO_DUAL_STACK: "false"

  meshConfig:
    accessLogFile: "/dev/stdout"
    defaultConfig:
      gatewayTopology:
        numTrustedProxies: 1
      proxyMetadata:
        ISTIO_DUAL_STACK: "false"

  gatewayClasses:
    istio:
      service:
        spec:
          type: ClusterIP

  # istiod already runs as non-root with a read-only root filesystem, no privilege
  # escalation, and all capabilities dropped. Pin the seccomp profile to complete
  # the baseline.
  seccompProfile:
    type: RuntimeDefault

  gateways:
    # Templated Gateway API gateways. Pin the seccomp profile. Leave securityContext
    # unset so Istio applies the minimum privileges needed to bind ports 80 and 443.
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 1Gi

# ---------------------------------------------------------------------------
# ztunnel — ztunnel DaemonSet (ambient mode L4 proxy)
# ---------------------------------------------------------------------------
ztunnel:
  # Hub to pull from. Image will be `Hub/Image:Tag-Variant`
  # hub: docker.io/istio

  # Tag to pull from. Image will be `Hub/Image:Tag-Variant`
  # tag: <tag>

  # Variant to pull. Options are "debug" or "distroless". Unset will use the default for the given version.
  # variant: ""

  # Image name to pull from. Image will be `Hub/Image:Tag-Variant`
  # If Image contains a "/", it will replace the entire `image` in the pod.
  # image: ztunnel

  meshConfig:
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_ROUTER_MODE: "sni-dnat"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

MONITORING_ENABLED: true
monitoring:
  scrapeInterval: 15s
