global:
  profile: ambient

  # namespace where istio will be installed
  istioNamespace: istio-system

  proxy:
    privileged: false
    seccompProfile:
      type: RuntimeDefault

  # Default hub for Istio images.
  # hub: docker.io/istio

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

# ---------------------------------------------------------------------------
# istio-base — CRDs and cluster-scoped resources
# ---------------------------------------------------------------------------
base:
  # Override the failurePolicy for the validation webhook.
  # By default, the webhook starts with "Ignore" and istiod flips it to "Fail" once ready.
  # Set to "Fail" to avoid the flip-flop, which is useful for server-side apply tools
  base:
    validationFailurePolicy: Fail    

# ---------------------------------------------------------------------------
# cni — CNI plugin DaemonSet
# ---------------------------------------------------------------------------
cni:
  # Default hub for Istio images.
  # hub: docker.io/istio

  # Can be a full hub/image:tag
  # image: install-cni

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# istiod — control plane (Pilot / istiod)
# ---------------------------------------------------------------------------
istiod:
  # Default hub for Istio images.
  # hub: docker.io/istio

  # Can be a full hub/image:tag
  # image: pilot

  # Default tag for Istio images.
  # tag: <tag>

  # Variant of the image to use.
  # Currently supported are: [debug, distroless]
  # variant: ""

  # Override the failurePolicy for the validation webhook.
  # By default, the webhook starts with "Ignore" and istiod flips it to "Fail" once ready.
  # Set to "Fail" to avoid the flip-flop, which is useful for server-side apply tools
  base:
    validationFailurePolicy: Fail    

  # ISTIO_DUAL_STACK requires two coordinated settings:
  #
  # 1. meshConfig.defaultConfig.proxyMetadata.ISTIO_DUAL_STACK
  #    istiod copies each proxyMetadata entry into the generated gateway pod as
  #    an environment variable, so this carries the flag into the gateway proxy.
  #
  # 2. env.ISTIO_DUAL_STACK (istiod Deployment env var)
  #    Changing this mutates the istiod pod template, which restarts istiod.
  #    Only a restarted istiod re-reads the mesh ConfigMap and reconciles
  #    existing gateway Deployments with the updated ProxyConfig.ProxyMetadata.
  #
  # Both must be changed together so that: (a) the new value is in the mesh
  # config, and (b) istiod restarts and propagates it to gateway pods.
  env:
    ISTIO_DUAL_STACK: "false"

  meshConfig:
    accessLogFile: "/dev/stdout"
    defaultConfig:
      gatewayTopology:
        numTrustedProxies: 1
      proxyMetadata:
        ISTIO_DUAL_STACK: "false"

  gatewayClasses:
    istio:
      service:
        spec:
          type: ClusterIP

  seccompProfile:
    type: RuntimeDefault

  gateways:
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 1Gi

# ---------------------------------------------------------------------------
# ztunnel — ztunnel DaemonSet (ambient mode L4 proxy)
# ---------------------------------------------------------------------------
ztunnel:
  # Hub to pull from. Image will be `Hub/Image:Tag-Variant`
  # hub: docker.io/istio

  # Tag to pull from. Image will be `Hub/Image:Tag-Variant`
  # tag: <tag>

  # Variant to pull. Options are "debug" or "distroless". Unset will use the default for the given version.
  # variant: ""

  # Image name to pull from. Image will be `Hub/Image:Tag-Variant`
  # If Image contains a "/", it will replace the entire `image` in the pod.
  # image: ztunnel

  meshConfig:
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_ROUTER_MODE: "sni-dnat"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

MONITORING_ENABLED: true
monitoring:
  scrapeInterval: 15s

# ---------------------------------------------------------------------------
# pre-deploy — namespace Pod Security Standards patch
# ---------------------------------------------------------------------------
# Istio ambient requires privileged pods (istio-cni needs hostNetwork plus
# NET_ADMIN/SYS_ADMIN; ztunnel needs the same). Where Pod Security Admission
# enforces "baseline" or "restricted" on this namespace, those DaemonSets are
# accepted as objects but their pods are rejected, leaving no data plane.
#
# When enabled, a pre-install/pre-upgrade hook Job labels the release namespace
# pod-security.kubernetes.io/enforce=privileged before Istio is installed.
# Opt-in: it is a no-op without PSA, and namespace security labels are usually
# owned by the cluster administrator. The label is NOT removed on uninstall.
ENABLE_PRIVILEGED_PSS: false

patchPss:
  # kubectl image for the patch Job.
  #
  # Split into parts so a private-registry installation can redirect the
  # registry alone and keep the rest. It is not an Istio image and does not
  # live under global.hub, which is the Istio hub (<hub>/pilot:<tag>) - so
  # whatever redirects the Istio images has to redirect this one too. It is a
  # pre-install hook: an image that cannot be pulled fails the whole release
  # before a single Istio manifest is applied.
  #
  # The tag is a released one on purpose. A floating tag with
  # imagePullPolicy: IfNotPresent leaves a node on whatever it happened to
  # pull first, and different nodes then run different versions.
  image:
    registry: ghcr.io
    repository: netcracker/qubership-docker-kubectl
    tag: 0.0.9
    # digest: sha256:...   # when set, used instead of tag
  imagePullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 75m
      memory: 75Mi
    limits:
      cpu: 150m
      memory: 150Mi

  # Must stay restricted-compliant: if the namespace already enforces
  # "restricted", a non-compliant pod is rejected and the label can never be
  # fixed. runAsUser must stay non-zero — runAsNonRoot alone is re-checked by the
  # kubelet against the image's user. 1001 matches the kubectl image's USER.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault

  # Container-level only — PSS "restricted" does not inherit these from the pod.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
